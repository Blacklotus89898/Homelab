global:
  domain: argocd.homelab.local  # CHANGE: your ArgoCD hostname

configs:
  params:
    server.insecure: true  # Set false when you have TLS via Istio/cert-manager
  cm:
    # Allow ArgoCD to manage its own Application resources
    resource.exclusions: |
      - apiGroups:
          - "*"
        kinds:
          - ProviderConfigUsage
        clusters:
          - "*"
    # Helm release name to ArgoCD app name mapping
    application.instanceLabelKey: argocd.argoproj.io/app-name

server:
  replicas: 1  # Scale to 2 for HA when ready
  revisionHistoryLimit: 3
  service:
    type: NodePort  # Switch to ClusterIP once Istio ingress gateway is in place (step 3)
    nodePortHttp: 31991
    nodePortHttps: 30443

# apps/argocd/values.yaml - add under repoServer:
repoServer:
  revisionHistoryLimit: 3
  resources:
    requests:
      ephemeral-storage: "500Mi"
    limits:
      ephemeral-storage: "2Gi"

applicationSet:
  replicas: 1
  revisionHistoryLimit: 3

notifications:
  enabled: true  # ntfy webhook is LAN-local, no credentials — no SealedSecret needed
  argocdUrl: "http://192.168.0.108:31991"  # how we actually browse ArgoCD; feeds template context
  resources:  # keep the controller small (disk-first constraint)
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  notifiers:
    service.webhook.ntfy: |
      url: http://ntfy.monitoring.svc.cluster.local
      headers:
        - name: Content-Type
          value: application/json
  triggers:
    # each trigger value is a LIST of conditions (argocd-notifications
    # unmarshals []triggers.Condition); `for:` is a sibling of `when:`,
    # not part of the expression.
    trigger.on-sync-failed: |
      - when: app.status.operationState.phase in ['Failed', 'Error']
        oncePer: app.status.operationState.syncResult.revision
        send: [ntfy-sync-failed]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        for: 5m
        oncePer: app.status.sync.revision
        send: [ntfy-health-degraded]
  templates:
    template.ntfy-sync-failed: |
      webhook:
        ntfy:
          method: POST
          path: /
          body: |
            {"topic":"homelab-alerts","title":"ArgoCD sync failed: {{.app.metadata.name}}","message":"operation {{.app.status.operationState.phase}}, sync {{.app.status.sync.status}}, rev {{.app.status.sync.revision}}","tags":["warning","argocd"],"click":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"}
    template.ntfy-health-degraded: |
      webhook:
        ntfy:
          method: POST
          path: /
          body: |
            {"topic":"homelab-alerts","title":"ArgoCD degraded: {{.app.metadata.name}}","message":"health {{.app.status.health.status}}, sync {{.app.status.sync.status}}, rev {{.app.status.sync.revision}}","tags":["rotating_light","argocd"],"click":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"}
  # Global subscriptions (every app, no per-app annotations). The engine's
  # global-cm format predates the `destinations:` style used in app
  # annotations: DefaultSubscription unmarshals only recipients/triggers/
  # selector, so `destinations:` is silently dropped and NOTHING is sent.
  # Recipient strings are `service:recipient`. And ParseConfig splits the
  # cm key `service.webhook.ntfy` into type=webhook + NAME=ntfy — the
  # destination is just `ntfy`, never `webhook.ntfy` (registry miss =>
  # "notification service 'webhook.ntfy' is not supported").
  subscriptions:
    - recipients:
        - ntfy
      triggers:
        - on-sync-failed
        - on-health-degraded

redis:
  enabled: true

dex:
  enabled: false  # Enable when you add SSO (e.g. GitHub/Okta)
