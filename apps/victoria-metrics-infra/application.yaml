apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3" # before the chart app: secret must exist for grafana init
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Blacklotus89898/Homelab.git
    targetRevision: HEAD
    path: infrastructure/victoria-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
