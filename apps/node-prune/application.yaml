apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-prune
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Blacklotus89898/Homelab.git
    targetRevision: HEAD
    path: infrastructure/node-prune
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # node-level system job, same home as kube-bench/pod-cleanup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # kube-system is built-in
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
