service:
  # ADR 0009: traefik is disabled (k3s `disable: [traefik]`), so k3s ServiceLB
  # (klipper svclb) binds 80/443 on every node for this Service. Pi-hole
  # *.lab.home -> 192.168.0.108. The fixed nodePorts are kept so old
  # :30131/:30328 bookmarks keep working; nothing in git uses them any more.
  type: LoadBalancer
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
      nodePort: 30233
    - name: http2
      port: 80
      targetPort: 80
      nodePort: 30131
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30328

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
