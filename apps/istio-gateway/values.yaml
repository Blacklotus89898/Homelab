service:
  # Using NodePort because Traefik holds ports 80/443 on the node.
  # HTTP:  192.168.0.108:30080
  # HTTPS: 192.168.0.108:30443
  # Switch to LoadBalancer after Traefik is removed (post step 3).
  type: NodePort
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
      nodePort: 30021
    - name: http2
      port: 80
      targetPort: 80
      nodePort: 30090
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30453

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
