apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Blacklotus89898/Homelab.git
    targetRevision: HEAD
    path: services/authentik
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default # adopted in place: keeps PVCs/NodePort/admin login
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # One-shot cutover — revert to ServerSideApply=true after first Synced.
      # The adopted Portainer deployments carry inline env `value:` creds; SSA
      # merges env by name, so they combine with git's `valueFrom:` refs into
      # an entry the API server rejects forever. Replace=PUT swaps the
      # deployments wholesale. ApplyOutOfSyncOnly keeps already-Synced
      # Services/PVCs out of the PUT path (Service PUT sans clusterIP fails).
      - Replace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
