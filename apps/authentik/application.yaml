apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Blacklotus89898/Homelab.git
    targetRevision: HEAD
    path: services/authentik
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default # adopted in place: keeps PVCs/NodePort/admin login
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # TEMP one-shot Replace cutover #2 (2026-10-01): the live postgres
      # deployment still carries the old exec-handler liveness fields owned
      # by a prior field manager; SSA merges them with the new tcpSocket
      # handler ("may not specify more than 1 handler type"). Replace PUTs
      # the OutOfSync Deployment wholesale; ApplyOutOfSyncOnly shields the
      # already-Synced objects. Revert to SSA once Synced.
      - Replace=true
      - ApplyOutOfSyncOnly=true
      # - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
