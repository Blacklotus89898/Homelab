apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Blacklotus89898/Homelab.git
    targetRevision: HEAD
    path: services/authentik
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default # adopted in place: keeps PVCs/NodePort/admin login
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Steady-state SSA. (Cutover history: adopted Portainer deployments had
      # inline env value: creds that SSA merges with git's valueFrom: refs into
      # invalid entries; one-shot Replace=true + ApplyOutOfSyncOnly=true PUT
      # the deployments per git — commits 102439f + ca69f00, 2026-10-01.)
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
