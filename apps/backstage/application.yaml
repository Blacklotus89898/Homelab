apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://backstage.github.io/charts
      chart: backstage
      targetRevision: "2.8.2"
      helm:
        releaseName: backstage
        valueFiles:
          - $values/apps/backstage/values.yaml
    - repoURL: git@github.com:Blacklotus89898/Homelab.git
      targetRevision: HEAD
      ref: values
    # Plain manifests alongside the chart: the canary Rollout, adopted via
    # workloadRef. ArgoCD has no helm post-renderer (argoproj/argo-cd#3698,
    # still open), so the chart's Deployment can't be patched in-render.
    # NOTE: the manifest lives in services/backstage/ — NOT under apps/ —
    # because the root app-of-apps watches all of apps/ recursively and
    # would claim the Rollout itself (and deadlock its sync on its health).
    - repoURL: git@github.com:Blacklotus89898/Homelab.git
      targetRevision: HEAD
      path: services/backstage
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  # The rollouts controller scales the chart's Deployment to 0 once this
  # Rollout is healthy (workloadRef scaleDown) — keep ArgoCD selfHeal out of
  # that fight: git stays the source of truth for the pod TEMPLATE, the
  # controller owns the handover replica counts.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backstage
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # ignoreDifferences alone only affects DIFFING — the sync would still
      # APPLY spec.replicas=2 from the chart render, scaling the referenced
      # Deployment back up mid-canary. This option makes ArgoCD send the LIVE
      # value for ignored fields instead.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
