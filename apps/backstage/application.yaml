apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://backstage.github.io/charts
      chart: backstage
      targetRevision: "2.8.2"
      helm:
        releaseName: backstage
        valueFiles:
          - $values/apps/backstage/values.yaml
        postRenderer:
          kustomize:
            patches:
              # Convert the chart's Deployment into an Argo Rollouts canary
              # Rollout. `add` (not `replace`): the chart only renders
              # spec.strategy when backstage.strategy is set — keep it unset in
              # values.yaml or this patch breaks.
              - target:
                  group: apps
                  version: v1
                  kind: Deployment
                  name: backstage
                patch: |
                  - op: replace
                    path: /apiVersion
                    value: argoproj.io/v1alpha1
                  - op: replace
                    path: /kind
                    value: Rollout
                  - op: add
                    path: /spec/strategy
                    value:
                      canary:
                        maxSurge: 1
                        maxUnavailable: 0
                        analysis: # background run: judges the whole rollout, aborts = auto-rollback
                          templates:
                            - templateName: front-door-success-rate
                          args:
                            - name: target
                              value: http://backstage.backstage.svc.cluster.local:7007
                        steps:
                          - setWeight: 50 # no mesh: traffic splits by replica ratio (1 of 2)
                          - pause:
                              duration: 5m
                  - op: add
                    path: /spec/progressDeadlineSeconds
                    value: 1800
                  - op: add
                    path: /spec/progressDeadlineAbort
                    value: true
    - repoURL: git@github.com:Blacklotus89898/Homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
