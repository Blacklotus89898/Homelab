backstage:
  image:
    registry: ghcr.io
    repository: blacklotus89898/backstage
    tag: "latest"
    pullPolicy: Always

  extraEnvVarsSecrets:
    - backstage-github-token
    - backstage-github-auth
    - backstage-k8s-token
    - backstage-argocd-token
    # backstage-jenkins  # uncomment after sealing the Jenkins API token

  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 2Gi

  appConfig:
    app:
      title: Homelab Portal
      baseUrl: http://192.168.0.108:30900
    organization:
      name: Homelab

    backend:
      baseUrl: http://192.168.0.108:30900
      listen:
        port: 7007
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
      cors:
        origin: http://192.168.0.108:30900
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      reading:
        allow:
          - host: raw.githubusercontent.com
      csp:
        upgrade-insecure-requests: false

    auth:
      environment: production
      providers:
        github:
          production:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

    proxy:
      endpoints:
        '/argocd/api':
          target: http://argocd-server.argocd.svc.cluster.local/api/v1/
          changeOrigin: true
          headers:
            Cookie: "argocd.token=${ARGOCD_TOKEN}"

    # Jenkins integration — uncomment after backstage-jenkins secret is sealed
    # jenkins:
    #   instances:
    #     - name: default
    #       baseUrl: http://jenkins.jenkins.svc.cluster.local:8080
    #       username: admin
    #       apiKey: ${JENKINS_API_KEY}  # from backstage-jenkins SealedSecret

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - url: https://kubernetes.default.svc
              name: homelab
              authProvider: serviceAccount
              skipTLSVerify: true
              serviceAccountToken: ${K8S_SA_TOKEN}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      providers:
        github:
          homelab:
            organization: 'Blacklotus89898'
            catalogPath: '/catalog-info.yaml'
            filters:
              branch: 'main'
            schedule:
              frequency:
                minutes: 30
              timeout:
                minutes: 3
      locations:
        - type: url
          target: https://raw.githubusercontent.com/Blacklotus89898/Homelab/main/catalog/all.yaml
        - type: url
          target: https://github.com/Blacklotus89898/Homelab/blob/main/templates/homelab-service/template.yaml

service:
  type: NodePort
  ports:
    backend: 7007
  nodePorts:
    backend: "30900"

postgresql:
  enabled: true
  auth:
    username: backstage
    password: backstage
    database: backstage
    postgresPassword: postgresadmin
  primary:
    initdb:
      scripts:
        grant_createdb.sql: |
          ALTER USER backstage CREATEDB;
