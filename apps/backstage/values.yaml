backstage:
  # Post-workloadRef-migration, this chart Deployment is only a TEMPLATE shell:
  # services/backstage/rollout.yaml adopts it and runs every pod. Serving
  # replicas live on the Rollout's own spec.replicas (= 2, canary-capable by
  # replica ratio). 0 here + ArgoCD enforcement (no ignoreDifferences) keeps
  # the shell pod-less forever — syncs can never scale it back up mid-canary.
  replicas: 0

  image:
    registry: ghcr.io
    repository: blacklotus89898/backstage
    # Pinned to the CI-built image for commit 2339a03 (petal:run scaffolder
    # action). To upgrade: merge a backstage/** change, wait for the
    # build-backstage.yaml run, then bump this to the new commit sha tag.
    tag: "2339a03c81b837fda78c514f312b5e4e91f809dc"
    pullPolicy: IfNotPresent

  extraEnvVarsSecrets:
    - backstage-github-token
    - backstage-github-auth
    - backstage-k8s-token
    - backstage-argocd-token
    - backstage-jenkins
    - petal-api-token # PETAL_API_TOKEN for petal:run (infrastructure/backstage-k8s-rbac)
    - backstage-external-access # BACKSTAGE_AUTOMATION_TOKEN (backend.auth.externalAccess)

  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 2Gi

  # Cold node restarts (drain + reboot maintenance) make Backstage boot slower
  # than the chart's default ~70s startup window — Postgres is also still
  # coming up, so migrations block. The kubelet then SIGKILLs the container
  # (exit 137 "failed startup probe") before it ever serves. Widen the window:
  # ~310s before the first restart is allowed.
  startupProbe:
    httpGet:
      path: /
      port: 7007
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30

  appConfig:
    app:
      title: Homelab Portal
      baseUrl: http://192.168.0.108:30900
    organization:
      name: Homelab

    backend:
      baseUrl: http://192.168.0.108:30900
      listen:
        port: 7007
      # Automation caller (E2E checks, scripted petal:run): a static service
      # token, limited to the scaffolder + catalog plugins. Its tasks carry no
      # user, so petal:run records the source as backstage:<entity>#unknown.
      # Revoke: delete this block + the sealed secret.
      auth:
        externalAccess:
          - type: static
            options:
              token: ${BACKSTAGE_AUTOMATION_TOKEN}
              subject: automation
            accessRestrictions:
              - plugin: scaffolder
              - plugin: catalog
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
      cors:
        origin: http://192.168.0.108:30900
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      reading:
        allow:
          - host: raw.githubusercontent.com
          # Cluster NodePort host: lets apis.yaml $text placeholders fetch
          # swagger specs from in-cluster services (previously a warn per API
          # entity on every refresh).
          - host: 192.168.0.108
      csp:
        upgrade-insecure-requests: false
        connect-src: ["'self'", 'http:', 'https:']

    auth:
      environment: production
      providers:
        github:
          production:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

    proxy:
      endpoints:
        '/argocd/api':
          target: http://argocd-server.argocd.svc.cluster.local/api/v1/
          changeOrigin: true
          headers:
            Cookie: "argocd.token=${ARGOCD_TOKEN}"
        '/jenkins':
          target: http://jenkins.jenkins.svc.cluster.local:8080
          changeOrigin: true
          allowedHeaders:
            - Authorization
          credentials: dangerously-allow-unauthenticated

    # petal:run scaffolder action (backstage/packages/backend/src/modules/petal.ts,
    # Petal ADR 0003). Writes need the bearer token; consoleUrl is what the
    # template's "Open run in Petal" link points at.
    petal:
      baseUrl: http://petal.petal.svc.cluster.local
      consoleUrl: https://petal.lab.home
      token: ${PETAL_API_TOKEN}

    jenkins:
      instances:
        - name: default
          baseUrl: http://jenkins.jenkins.svc.cluster.local:8080
          username: admin
          apiKey: ${JENKINS_API_KEY}

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - url: https://kubernetes.default.svc
              name: homelab
              authProvider: serviceAccount
              skipTLSVerify: true
              serviceAccountToken: ${K8S_SA_TOKEN}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      # NO github provider here, deliberately: 'Blacklotus89898' is a USER,
      # not an org — the provider's org scan swept in 60+ collaborator repos
      # as junk Location entities, and its catalogPath glob emitted literal
      # '*' targets that never resolved (verified live 2026-10-14, see KB
      # solutions/backstage-golden-path.md). The static wildcard location
      # below is the supported primitive: the last path segment may be '*'
      # (GitHub tree read). A scaffolded service drops a file in
      # catalog/components/ and the catalog picks it up on its next refresh —
      # no hand-editing of any registry file.
      locations:
        - type: url
          target: https://github.com/Blacklotus89898/Homelab/blob/main/catalog/components/*.yaml
        - type: url
          target: https://raw.githubusercontent.com/Blacklotus89898/Homelab/main/catalog/homelab-system.yaml
        - type: url
          target: https://raw.githubusercontent.com/Blacklotus89898/Homelab/main/catalog/users.yaml
        - type: url
          target: https://raw.githubusercontent.com/Blacklotus89898/Homelab/main/catalog/apis.yaml
        - type: url
          target: https://github.com/Blacklotus89898/Homelab/blob/main/templates/homelab-service/template.yaml
        - type: url
          target: https://github.com/Blacklotus89898/Homelab/blob/main/templates/petal-run/template.yaml

service:
  type: NodePort
  ports:
    backend: 7007
  nodePorts:
    backend: "30900"

postgresql:
  enabled: true
  auth:
    username: backstage
    password: backstage
    database: backstage
    postgresPassword: postgresadmin
  primary:
    initdb:
      scripts:
        grant_createdb.sql: |
          ALTER USER backstage CREATEDB;
