apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkding
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Blacklotus89898/Homelab.git
    targetRevision: HEAD
    path: services/linkding
  destination:
    server: https://kubernetes.default.svc
    namespace: linkding
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The PVC no longer pins volumeName (it named a PV that only exists on
      # the current cluster, so a rebuild left the claim Pending forever —
      # 2026-11-05 bootstrap rehearsal). volumeName is immutable once bound:
      # ignore it below AND respect that on sync, or SSA would try to clear it.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /metadata/annotations/pv.kubernetes.io~1bind-completed
        - /metadata/annotations/pv.kubernetes.io~1bound-by-controller
        - /metadata/annotations/volume.beta.kubernetes.io~1storage-provisioner
        - /metadata/annotations/volume.kubernetes.io~1selected-node
        - /metadata/annotations/volume.kubernetes.io~1storage-provisioner
        - /spec/volumeName
