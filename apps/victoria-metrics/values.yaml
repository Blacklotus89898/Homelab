# VictoriaMetrics k8s-stack — full monitoring, disk-budgeted (roadmap Phase 1).
# Decision 2026-09-28: single-binary VM instead of kube-prometheus-stack (disk constraint).
# Disk target: <2G actual all-in. Caps below bound the worst case:
#   vmsingle PVC ceiling 8Gi (expected actual ~1-2G at this cluster's scale),
#   grafana PVC 2Gi, everything else ephemeral.
#
# Chart defaults kept deliberately (vmagent scrapes via its VMServiceScrape/
# VMNodeScrape CRs, vmalert evaluates defaultRules). Only deltas from defaults
# below — alertmanager config is overridden to route everything to ntfy.

# Short fullname: the VM operator builds pod labels from CR names — the default
# "victoria-metrics-victoria-metrics-k8s-stack-*" exceeds k8s' 63-char label limit.
fullnameOverride: vmstack

defaultRules:
  enabled: true # recording + alerting rules for k8s components
  rules:
    # 2026-10-21: RecordingRulesNoData has inverted logic on a healthy cluster.
    # The kube-prometheus-general rule `count:up0` = count of DOWN targets —
    # when everything is up, count(up == 0) is an empty set → 0 samples → the
    # alert fires precisely BECAUSE the cluster is healthy (verified live:
    # count:up1=23 samples, count:up0=0, alert firing on the 0). Real rule
    # breakage is still covered by RecordingRulesError / AlertingRulesError.
    RecordingRulesNoData:
      enabled: false

defaultDashboards:
  enabled: true # Grafana dashboards via ConfigMap sidecar

vmsingle:
  spec:
    retentionPeriod: "30d" # bounded retention (default is 1 month; explicit beats implicit)
    storage:
      resources:
        requests:
          storage: 8Gi # hard ceiling on the local-path volume
    resources:
      requests:
        cpu: 50m
        # 2026-10-20: 200Mi→512Mi — idles at ~360Mi; the old request
        # under-reported the steady state to the scheduler.
        memory: 512Mi
      limits:
        # 2026-10-20: 512Mi→2Gi. At 512Mi the 30d-window SLO recording
        # rules (avg_over_time(...[30d]), 6-9s/query from vmalert) pushed
        # working-set past the cap → OOMKilled ~9x/day (187 restarts since
        # 2026-09-29). 2Gi ≈ 5.5x idle headroom; the monitoring LimitRange
        # max was raised to match (platform/observability/limitrange.yaml).
        memory: 2Gi

# k3s embeds scheduler + controller-manager in the control-plane binary — the
# chart's standalone-pod scrapes/rules can never find targets here and would
# false-positive (KubeSchedulerDown / KubeControllerManagerDown / no-data rules).
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
# k3s runs the sqlite datastore (no --cluster-init, single control-plane) — there
# is no etcd to scrape; the chart's headless vmstack-kube-etcd Service selects
# nothing, so the scrape pool sits empty and ScrapePoolHasNoTargets fires forever.
kubeEtcd:
  enabled: false

# node-exporter DaemonSet: chart sets no resources → the monitoring-ns LimitRange
# default (250m CPU limit) throttled its per-core collectors ~20% of CPU periods
# (CPUThrottlingHigh riding the 25% alert threshold; verified live 2026-10-21).
# Explicit headroom — the exporter itself stays tiny.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

alertmanager:
  # Route all firing alerts to the ntfy push relay (infrastructure/ntfy, NodePort 30310).
  # webhook_configs POSTs application/json; ntfy treats non-text/plain bodies as
  # attachment uploads, and attachments are disabled server-side → 400 on every
  # notification (AlertmanagerFailedToSendAlerts, found 2026-10-14). Fix: ntfy's
  # built-in alertmanager template (?template=alertmanager) parses the webhook
  # payload into a formatted notification — verified live on ntfy v2.28.0 before
  # this change; no bridge deployment needed. Subscribe from a phone: topic
  # "homelab-alerts" on http://192.168.0.108:30310.
  config:
    route:
      receiver: ntfy
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: blackhole
          matchers:
            - alertname = "Watchdog" # always-firing heartbeat; would page every 4h
        - receiver: blackhole
          matchers:
            - severity = "none" # InfoInhibitor + Watchdog are inhibition meta-alerts, not pages
        - receiver: blackhole
          matchers:
            - severity = "info" # push channel is for warning+; info stays in Grafana
        - receiver: blackhole
          matchers:
            # structural on this cluster (requests overcommit by design on a full
            # homelab); visible in Grafana, not worth a 4-hourly push
            - alertname = "KubeMemoryOvercommit"
        - receiver: blackhole
          matchers:
            # same class as KubeMemoryOvercommit above: CPU requests overcommit
            # is by design on the single worker; Grafana-only
            - alertname = "KubeCPUOvercommit"
        - receiver: blackhole
          matchers:
            # arc-controller app Suspended by user decision 2026-09-28 → its
            # deployment is chronically mismatched; paging would repeat every 4h
            - namespace = "arc-systems"
    receivers:
      - name: blackhole # no integrations = drop
      - name: ntfy
        webhook_configs:
          - url: "http://ntfy.monitoring.svc/homelab-alerts?template=alertmanager"
            send_resolved: true
            max_alerts: 3

grafana:
  # Explicit resources: without them the ns LimitRange default (256Mi limit) OOMKills
  # grafana 13 during startup provisioning.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  admin:
    existingSecret: grafana-admin-credentials # SealedSecret in infrastructure/victoria-metrics/
  persistence:
    enabled: true
    size: 2Gi
  service:
    type: NodePort
    nodePort: 30300 # http://192.168.0.108:30300
