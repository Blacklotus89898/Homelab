# THROWAWAY E2E test for ArgoCD notifications -> ntfy; removed as soon as
# the alert lands. The target namespace is never created (CreateNamespace=false),
# so the first automated sync fails fast and the on-sync-failed trigger fires.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notifications-e2e
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Blacklotus89898/Homelab.git
    targetRevision: HEAD
    path: infrastructure/notifications-e2e
  destination:
    server: https://kubernetes.default.svc
    namespace: notifications-e2e # does not exist on purpose
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
