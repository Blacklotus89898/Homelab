# "Service health" Grafana dashboard (sidecar-provisioned via the grafana_dashboard
# label): uptime + status timeline per front door, the four golden signals per
# service at the Istio gateway, and pod kills / OOM / memory headroom for
# prevention. Pairs with golden-signals-rules.yaml. Generated 2026-11-12 by a
# script; every query was run against vmsingle before committing.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-health
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  service-health.json: "{\n \"title\": \"Service health\",\n \"uid\": \"service-health\",\n \"description\": \"Uptime, golden signals per service, pod kills / OOM / memory headroom.\",\n \"tags\": [\n  \"homelab\",\n  \"golden-signals\"\n ],\n \"timezone\": \"browser\",\n \"schemaVersion\": 39,\n \"refresh\": \"1m\",\n \"time\": {\n  \"from\": \"now-7d\",\n  \"to\": \"now\"\n },\n \"graphTooltip\": 1,\n \"templating\": {\n  \"list\": [\n   {\n    \"name\": \"datasource\",\n    \"type\": \"datasource\",\n    \"query\": \"prometheus\"\n   }\n  ]\n },\n \"panels\": [\n  {\n   \"type\": \"row\",\n   \"title\": \"Uptime & status (blackbox probes on every front door, every 30s)\",\n   \"id\": 1,\n   \"collapsed\": false,\n   \"gridPos\": {\n    \"h\": 1,\n    \"w\": 24,\n    \"x\": 0,\n    \"y\": 0\n   },\n   \"panels\": []\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Uptime over the selected range\",\n   \"id\": 2,\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"$datasource\"\
    \n   },\n   \"description\": \"Share of successful probes over the dashboard's time range. Green >= 99.9%, orange >= 99%.\",\n   \"gridPos\": {\n    \"h\": 9,\n    \"w\": 12,\n    \"x\": 0,\n    \"y\": 1\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"$datasource\"\n     },\n     \"expr\": \"avg_over_time(probe_success{job=~\\\"gateway-front-doors|front-doors\\\"}[$__range])\",\n     \"legendFormat\": \"{{instance}}\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\",\n     \"decimals\": 2,\n     \"min\": 0,\n     \"max\": 1,\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"orange\",\n        \"value\": 0.99\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 0.999\n       }\n      ]\n     }\n    },\n    \"overrides\"\
    : []\n   },\n   \"options\": {\n    \"colorMode\": \"background\",\n    \"graphMode\": \"none\",\n    \"textMode\": \"value_and_name\",\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ]\n    },\n    \"orientation\": \"horizontal\"\n   }\n  },\n  {\n   \"type\": \"state-timeline\",\n   \"title\": \"Status over time\",\n   \"id\": 3,\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"$datasource\"\n   },\n   \"description\": \"One row per front door; red is time it didn't answer.\",\n   \"gridPos\": {\n    \"h\": 9,\n    \"w\": 12,\n    \"x\": 12,\n    \"y\": 1\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"$datasource\"\n     },\n     \"expr\": \"min by (instance) (probe_success{job=~\\\"gateway-front-doors|front-doors\\\"})\",\n     \"legendFormat\": \"{{instance}}\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"mappings\": [\n      {\n\
