    \      \"lastNotNull\"\n     ]\n    },\n    \"displayMode\": \"gradient\",\n    \"orientation\": \"horizontal\"\n   }\n  },\n  {\n   \"type\": \"row\",\n   \"title\": \"Golden signals per service (as the Istio gateway sees them)\",\n   \"id\": 8,\n   \"collapsed\": false,\n   \"gridPos\": {\n    \"h\": 1,\n    \"w\": 24,\n    \"x\": 0,\n    \"y\": 15\n   },\n   \"panels\": []\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Traffic (requests/s)\",\n   \"id\": 9,\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"$datasource\"\n   },\n   \"description\": \"Mostly probes at this cluster's scale.\",\n   \"gridPos\": {\n    \"h\": 8,\n    \"w\": 12,\n    \"x\": 0,\n    \"y\": 16\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"$datasource\"\n     },\n     \"expr\": \"sum by (destination_service_name) (rate(istio_requests_total{reporter=\\\"source\\\"}[$__rate_interval]))\",\n     \"legendFormat\": \"{{destination_service_name}}\"\
    ,\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 5,\n      \"showPoints\": \"never\"\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {}\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Errors (5xx share)\",\n   \"id\": 10,\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"$datasource\"\n   },\n   \"description\": \"ServiceErrorRateHigh pages above 10% (with >= 20 requests in 10m).\",\n   \"gridPos\": {\n    \"h\": 8,\n    \"w\": 12,\n    \"x\": 12,\n    \"y\": 16\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"$datasource\"\n     },\n     \"expr\": \"sum by (destination_service_name) (rate(istio_requests_total{reporter=\\\"source\\\",response_code=~\\\"5..\\\"}[$__rate_interval])) / sum by (destination_service_name) (rate(istio_requests_total{reporter=\\\"\
