# Istio ambient mesh telemetry (Phase A of the Istio adoption, 2026-10-21).
# Ambient without waypoints is L4-only: ztunnel exports istio_tcp_* (bytes,
# connections, per src/dst workload) — there is no istio_requests_total until
# a waypoint carries L7. The ztunnel + control-plane dashboards in
# istio-dashboards.yaml are the ones that have data today.
#
# podTargetLabels copies the pod's `app` label onto every series: the upstream
# Istio dashboards select on {app="ztunnel"} / {app="istiod"}.
# seriesLimit is the cardinality guard (vmsingle OOM-looped until 2026-10-21):
# measured 2026-10-21 — ztunnel ~600 series/node, istiod ~300, gateway ~500.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: istio-ztunnel
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [istio-system]
  selector:
    matchLabels:
      app: ztunnel
  podTargetLabels: [app]
  podMetricsEndpoints:
    - port: ztunnel-stats
      path: /metrics
      seriesLimit: 3000
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: istio-istiod
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [istio-system]
  selector:
    matchLabels:
      app: istiod
  podTargetLabels: [app]
  podMetricsEndpoints:
    - port: http-monitoring
      path: /metrics
      seriesLimit: 2000
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: istio-gateway
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [istio-system]
  selector:
    matchLabels:
      istio: gateway
  podTargetLabels: [app, istio]
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      # 2026-11-24: at 3000 the gateway went over the limit as routes were
      # added, and vmagent dropped the newest series, which were latency
      # histogram buckets: Warden /services showed traffic but no p95 for
      # linkding, petal, tulip, sprout, openobserve and monitoring. The
      # request/response *size* histograms (~20 buckets per
      # source x destination x code) are read by no dashboard, rule or
      # Warden query, so they are dropped before the limit is counted, and
      # the limit gets headroom for new routes.
      seriesLimit: 6000
      metricRelabelConfigs:
        - action: drop
          source_labels: [__name__]
          regex: istio_(request|response)_bytes_(bucket|sum|count)
