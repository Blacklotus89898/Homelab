# ONE-SHOT v2 (decision-log pattern 2026-10-14): v1 completed but its
# crictl fataled (k3s multi-call crictl needs the agent config — now
# mounted). Jobs are immutable, so the fixed run lives under a new name.
# REMOVE this file in the follow-up commit once Complete.
apiVersion: batch/v1
kind: Job
metadata:
  name: node-prune-once-worker-2
  namespace: kube-system
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeName: k3s-worker-01
      restartPolicy: Never
      containers:
        - name: prune-report
          image: rancher/k3s:v1.34.5-k3s1@sha256:2b34ec72d589bf0a4e065b81267a63a271ecbe242a36bdbb48ec608f0560cb43
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "== disk before =="
              df -h / | tail -1
              crictl rmi --prune
              echo "== disk after =="
              df -h / | tail -1
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/k3s/containerd
            - name: k3s-agent-etc
              mountPath: /var/lib/rancher/k3s/agent/etc
              readOnly: true
      volumes:
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd
            type: Directory
        - name: k3s-agent-etc
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc
            type: Directory
