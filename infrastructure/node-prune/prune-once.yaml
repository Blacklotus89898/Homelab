# ONE-SHOT (decision-log pattern 2026-10-14): immediate prune + disk
# ground-truth on the 83%-full worker. REMOVE this file in the follow-up
# commit once the Job is Complete, so ArgoCD can never re-run it.
apiVersion: batch/v1
kind: Job
metadata:
  name: node-prune-once-worker
  namespace: kube-system
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeName: k3s-worker-01
      restartPolicy: Never
      containers:
        - name: prune-report
          image: rancher/k3s:v1.34.5-k3s1@sha256:2b34ec72d589bf0a4e065b81267a63a271ecbe242a36bdbb48ec608f0560cb43
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "== disk before =="
              df -h / | tail -1
              crictl --runtime-endpoint unix:///run/k3s/containerd/containerd.sock rmi --prune || echo "crictl prune returned $? (continuing for the report)"
              echo "== disk after =="
              df -h / | tail -1
              echo "== local-path PV usage (top 12) =="
              du -sh /var/lib/rancher/k3s/storage/* 2>/dev/null | sort -h | tail -12 || true
              echo "== journald size =="
              du -sh /var/log/journal 2>/dev/null || echo "no /var/log/journal (volatile journal)"
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/k3s/containerd
            - name: storage
              mountPath: /var/lib/rancher/k3s/storage
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
      volumes:
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd
            type: Directory
        - name: storage
          hostPath:
            path: /var/lib/rancher/k3s/storage
            type: Directory
        - name: journal
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
