# ONE-SHOT (decision-log pattern 2026-10-14): openobserve-0 is wedged —
# the StatefulSet monotonic rollout will not replace a never-ready pod,
# and the pod panics forever on the pre-fix env (retention=1). Git state
# is correct (retention=3 synced; updateRevision != currentRevision).
# This Job performs the pod delete IN-CLUSTER through git (the live
# kubectl path is off-limits by the one rule; pg_resetwal precedent).
# REMOVE this file in the follow-up commit once Complete.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-nudge
  namespace: openobserve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-nudge
  namespace: openobserve
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-nudge
  namespace: openobserve
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout-nudge
subjects:
  - kind: ServiceAccount
    name: rollout-nudge
    namespace: openobserve
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-nudge-openobserve-2
  namespace: openobserve
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: rollout-nudge
      restartPolicy: Never
      containers:
        - name: nudge
          image: registry.k8s.io/kubectl:v1.34.5@sha256:de4688e1c070b5c236a557bddd48dc593cd1d6a7916994cbf379426cdd4c61ea
          command: ["kubectl"]
          args:
            - -n
            - openobserve
            - delete
            - pod
            - openobserve-0
            - --wait=true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
