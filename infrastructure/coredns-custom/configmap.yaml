# k3s CoreDNS extension hook: the bundled Corefile imports
# /etc/coredns/custom/*.server from this (optional) ConfigMap.
# Forwards the LAN zone `home` — including `lab.home`, the Istio gateway's
# wildcard (ADR 0009) — to the Pi-hole, so pods resolve jellyfin.home,
# proxmox.home, kavita.lab.home the same way LAN clients do. Everything else
# keeps the default path (node /etc/resolv.conf).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  home.server: |
    home:53 {
        errors
        cache 30
        forward . 192.168.0.53
    }
