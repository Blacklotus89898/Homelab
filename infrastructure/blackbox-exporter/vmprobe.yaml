# VM operator wires this into vmagent automatically: both vmstack vmalert/vmagent run
# with selectAllByDefault=true (empty selectors, verified 2026-10-08), so any VMProbe
# in any namespace becomes a scrape target and any VmRule becomes alert rules.
# The `instance` label on the resulting probe_* series = the target URL below.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: front-doors
  namespace: monitoring
spec:
  jobName: front-doors
  interval: 30s # 10 samples per 5m burn window — enough resolution for the SLO math
  vmProberSpec: # NOT vmProber — VM operator's field name (kubeconform CI caught this; live CRD agrees)
    url: blackbox-exporter.monitoring.svc:9115
    scheme: http
  module: http_2xx
  targets:
    staticConfig: # not `static` — live CRD accepts both, but the CI schema catalog only knows staticConfig
      targets:
        # The cluster has no Ingress/gateway yet (architecture.md) — the front doors ARE
        # the in-cluster service endpoints. Names/ports verified live 2026-10-08.
        - http://petal.petal.svc.cluster.local
        - http://backstage.backstage.svc.cluster.local:7007
        - http://kavita-service.kavita.svc.cluster.local:5000
        - http://linkding-svc.linkding.svc.cluster.local:9090
        - http://argocd-server.argocd.svc.cluster.local
        - http://victoria-metrics-grafana.monitoring.svc.cluster.local
        # Added 2026-11-05 — health paths verified 200 via blackbox /probe. tulip/warden
        # serve 404 on `/`, so probe their own readiness path (/health). tulip: GET
        # /health only — never the approval/killswitch endpoints (CLAUDE.md boundary).
        - http://tulip-svc.tulip.svc.cluster.local:8080/health
        - http://warden.warden.svc.cluster.local:8080/health
        - http://sprout-svc.sprout.svc.cluster.local:8080/health # 200 via blackbox /probe, verified 2026-11-12
        - http://authentik.default.svc.cluster.local:9000/-/health/ready/ # WAL recovered; lives in `default` ns
        # Excluded by design: audiobookshelf (app Suspended). Add back when it serves again.
