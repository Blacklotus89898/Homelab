apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  config.yml: |
    # Blackbox probing of the cluster's front doors (in-cluster service DNS).
    # External reachability (NodePorts from the LAN/internet) is uptime-kuma's job —
    # this config answers "is the service itself up", not "is the cluster reachable".
    modules:
      http_2xx:
        prober: http
        http:
          preferred_ip_protocol: ip4 # cluster DNS + svc CIDRs are v4 here
          follow_redirects: true # several front doors 302 to /login
