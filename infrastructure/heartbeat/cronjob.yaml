# Dead-man switch, cluster side: push a heartbeat commit to the orphan
# `heartbeat` branch twice an hour. The GitHub-side watchdog workflow
# (.github/workflows/heartbeat-watchdog.yml) runs on GitHub's infra —
# outside the cluster — and opens an issue if the branch goes stale.
# This is the ONLY alert path that survives the whole cluster being down
# (vmalertmanager, uptime-kuma and ArgoCD notifications are all in-cluster).
# Own namespace since 2026-10-23 (ARC retired, ADR 0010): the PAT is sealed
# here as heartbeat-github-pat (sealed-github-pat.yaml) — classic PAT, scope
# `repo`; rotation: README "Rotating the heartbeat PAT".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-heartbeat
  namespace: heartbeat
spec:
  schedule: "7,37 * * * *" # 2x/hour, off the :00/:30 marks
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600 # keep last evidence an hour for debugging
      # The script retries internally; one extra pod is plenty. (Default 6 meant
      # up to 7 "push FAILED" pages per beat during a GitHub outage.)
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: cluster-heartbeat
        spec:
          restartPolicy: Never
          containers:
            - name: heartbeat
              image: alpine/git:2.54.0 # pinned; renovate bumps
              resources: # required by policies/require-container-resources (CI-enforced)
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              env:
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: heartbeat-github-pat
                      key: github_token
              command: ["/bin/sh", "-eu", "-c"] # -c or sh treats the script arg as a filename
              args:
                - |
                  git config --global user.name "homelab-heartbeat"
                  git config --global user.email "heartbeat@homelab.local"
                  # credential helper keeps the token out of remote URLs and error output
                  git config --global credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'
                  # One beat = fresh clone + commit + push. Retried in-script so a
                  # GitHub blip doesn't page: 2026-11-04 a major GitHub Git-ops
                  # incident failed the first push at 10:07Z and 10:37Z, the Job's
                  # retry pod landed both beats ~10s later — yet each first
                  # failure had already paged. Clone failures are covered too
                  # (under -e a failed clone used to exit before the alert).
                  beat() {
                    rm -rf /hb
                    git clone --quiet --depth 1 -b heartbeat https://github.com/Blacklotus89898/Homelab.git /hb || return 1
                    printf '%s\n' "$(date -u +%s) $(date -u +%FT%TZ)" > /hb/heartbeat.txt
                    git -C /hb add heartbeat.txt
                    git -C /hb commit --quiet -m "heartbeat $(date -u +%FT%TZ)" || return 1
                    git -C /hb push --quiet origin heartbeat
                  }
                  for wait in 0 20 60; do
                    sleep "$wait"
                    if beat; then exit 0; fi
                    echo "heartbeat attempt failed (next wait after ${wait}s)" >&2
                  done
                  # Cluster is UP but the beat can't get out after ~80s of retries
                  # (PAT expired? GitHub down?). Say so locally before the watchdog
                  # pages "cluster dark" — busybox wget, alpine/git has no curl.
                  wget -qO- --header "Title: Heartbeat push FAILED (cluster is up)" \
                    --header "Tags: warning" \
                    --post-data="Heartbeat CronJob could not push to GitHub after 3 attempts (~80s). Check https://www.githubstatus.com first; if GitHub is fine, check the PAT in heartbeat-github-pat and: kubectl -n heartbeat get jobs" \
                    http://ntfy.monitoring.svc.cluster.local/homelab-alerts || true
                  exit 1
