apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    app: ntfy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
      annotations:
        # config-roll: subPath configmap mounts don't hot-reload — bump this to
        # force a pod recreate through ArgoCD when server.yml changes.
        # 2026-10-21: upstream-base-url added (iOS push via ntfy.sh bridge)
        homelab.io/config-version: "2026-10-21-upstream"
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.28.0 # official image, pinned (repo rule: no :latest)
          args: ["serve"]
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy/server.yml
              subPath: server.yml
            - name: cache
              mountPath: /var/cache/ntfy
          resources:
            # Explicit: monitoring ns LimitRange would otherwise default us to 256Mi
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: cache
          emptyDir: {} # no PVC by design — cache is disposable, disk is the constraint
