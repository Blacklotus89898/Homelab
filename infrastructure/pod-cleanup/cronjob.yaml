apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: kube-system
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60
      template:
        spec:
          serviceAccountName: pod-cleanup
          restartPolicy: Never
          containers:
            - name: cleanup
              image: registry.k8s.io/kubectl:v1.34.5 # official image, pinned to cluster's k8s version; bitnami/kubectl no longer publishes version tags (2025 catalog change)
              resources: # required by policies/require-resources.yaml (CI-enforced)
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              command:
                - /bin/sh
                - -c
                - |
                  kubectl delete pods --all-namespaces \
                    --field-selector 'status.phase=Succeeded' 2>/dev/null || true
                  kubectl delete pods --all-namespaces \
                    --field-selector 'status.phase=Failed' 2>/dev/null || true
                  kubectl delete pods --all-namespaces \
                    --field-selector 'status.phase=Unknown' 2>/dev/null || true
