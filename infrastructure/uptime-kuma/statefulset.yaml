apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: uptime-kuma
  namespace: monitoring
  labels:
    app: uptime-kuma
spec:
  serviceName: uptime-kuma
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
        # Out of the ambient mesh ON PURPOSE: ztunnel accepts every outbound
        # TCP connect locally (verified 2026-10-21 — a connect to an unused IP
        # or a closed port "succeeds" from any enrolled pod), so TCP port
        # monitors from inside the mesh are always UP. A prober must see the
        # network directly. HTTP/DNS checks were unaffected.
        istio.io/dataplane-mode: none
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.1.2 # pinned; 2.x is the maintained line (1.x EOL Oct 2025)
          ports:
            - containerPort: 3001
              name: http
          env:
            # Pre-answers the 2.x first-run "setup database" wizard: with the
            # env set, uptime-kuma writes db-config.json itself (embedded
            # SQLite) — declarative, survives a rebuild with an empty PVC.
            - name: UPTIME_KUMA_DB_TYPE
              value: sqlite
            # Trust the homelab local CA (ADR 0009) so the front-door monitors
            # verify TLS for real and track cert expiry. ca.crt comes from
            # ca-bundle.yaml's cert-manager Certificate, so it follows the CA
            # automatically (including a rebuild that mints a new one).
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/lab-ca/ca.crt
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: lab-ca
              mountPath: /etc/lab-ca
              readOnly: true
          resources:
            # Explicit: monitoring ns LimitRange caps at 512Mi/container
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http # login page returns 200 when the app is up
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
      volumes:
        - name: lab-ca
          secret:
            secretName: uptime-kuma-lab-ca
            items:
              - key: ca.crt
                path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi # SQLite + heartbeat history; retention set to 14d by tools/uptime-kuma/provision.py (180d default would outgrow this)
