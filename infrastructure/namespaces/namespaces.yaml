# Wave -5: all namespaces created before any other app installs
# Istio ambient enrollment is controlled per-namespace via the label below.
# To enroll a namespace in the mesh: add label istio.io/dataplane-mode: ambient
# To enroll for L7 (waypoint proxy): also add istio.io/use-waypoint: waypoint
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager

---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system

---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-cni

---
apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets

---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Enroll monitoring namespace in Istio ambient mesh
    istio.io/dataplane-mode: ambient

---
apiVersion: v1
kind: Namespace
metadata:
  name: openobserve
  labels:
    istio.io/dataplane-mode: ambient

---
# Backstage excluded from ambient mesh — NodePort access requires plain HTTP
apiVersion: v1
kind: Namespace
metadata:
  name: backstage

---
# Catch-all namespace for homelab services
apiVersion: v1
kind: Namespace
metadata:
  name: homelab
  labels:
    istio.io/dataplane-mode: ambient

---
apiVersion: v1
kind: Namespace
metadata:
  name: kavita
  labels:
    istio.io/dataplane-mode: ambient

---
apiVersion: v1
kind: Namespace
metadata:
  name: linkding
  labels:
    istio.io/dataplane-mode: ambient

---
apiVersion: v1
kind: Namespace
metadata:
  name: audiobookshelf
  labels:
    istio.io/dataplane-mode: ambient

---
# Dead-man switch CronJob (infrastructure/heartbeat) — its own ns since ARC's
# retirement (ADR 0010); plain git push to GitHub, no mesh needed
apiVersion: v1
kind: Namespace
metadata:
  name: heartbeat

---
# Petal IDP — NodePort access + DinD sidecar (Docker builds); excluded from ambient mesh
apiVersion: v1
kind: Namespace
metadata:
  name: petal

---
# Tulip trading agent (github.com/Blacklotus89898/Tulip) — single SQLite writer;
# outbound only to market data + the Anthropic API; not in the mesh yet
apiVersion: v1
kind: Namespace
metadata:
  name: tulip

---
# Warden incident-investigation agent (github.com/Blacklotus89898/Warden,
# Homelab ADR 0011) — read-only SA; not in the mesh yet
apiVersion: v1
kind: Namespace
metadata:
  name: warden

---
# Argo Rollouts controller — no mesh label needed; talks to the API server only
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
