# Generated by the homelab-service golden path (templates/homelab-service).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}
  namespace: argocd
  annotations:
    # Wave 1: after the gateways app (wave 0), so this app's HTTPRoute finds its
    # Gateway on a rebuild. The route lives in services/${{ values.name }}/, not in
    # platform/gateways/routes.yaml, and waves only order things within one app.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Blacklotus89898/Homelab.git
    targetRevision: HEAD
    path: services/${{ values.name }}
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.name }}
  syncPolicy:
    automated:
      prune: true # house standard: git deletions remove the live object
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # fallback only; namespace.yaml owns the namespace
      - ServerSideApply=true
