# ${{ values.name }}: generated by the homelab-service golden path.
# Upgrade: the service repo's CI pushes :<sha>, then bump the image below in a PR.
{%- if values.pvcSize != "none" %}
# Recreate: the volume has one writer, so two pods must never overlap.
{%- endif %}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ${{ values.name }}
  strategy:
    type: ${{ "Recreate" if values.pvcSize != "none" else "RollingUpdate" }}
  template:
    metadata:
      labels:
        app: ${{ values.name }}
    spec:
      # Golden-path default: no SA token unless the service needs one (CIS 5.1.6)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: ${{ values.runAsUser }}
        runAsGroup: ${{ values.runAsUser }}
        fsGroup: ${{ values.runAsUser }} # volumes writable by the container user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ values.name }}
          image: ${{ values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http # the Service, VMServiceScrape and HTTPRoute refer to it
              containerPort: ${{ values.containerPort }}
              protocol: TCP
          resources:
{%- if values.size == "large" %}
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
{%- elif values.size == "medium" %}
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
{%- else %}
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
{%- endif %}
          livenessProbe:
            httpGet:
              path: ${{ values.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: ${{ values.healthPath }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # writable paths are the mounts below
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
{%- if values.pvcSize != "none" %}
            - name: data
              mountPath: ${{ values.dataPath }}
{%- endif %}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{%- if values.pvcSize != "none" %}
        - name: data
          persistentVolumeClaim:
            claimName: ${{ values.name }}-data
{%- endif %}
