# Backstage -> Petal trigger (Petal ADR 0003). The petal:run action lives in
# backstage/packages/backend/src/modules/petal.ts; it queues the run with the
# provenance `backstage:<entity>#<user>` and returns immediately — the run
# itself is followed in Petal's console (link in the output).
#
# Multi-repo (Petal ADR 0004): the run's source repo comes from the chosen
# component's `petal.io/repo` annotation — an alias in Petal's allowlist
# (services/petal/repos-configmap.yaml) — and its pipelines live in that repo's
# .petal/pipelines/. Opting a component in = add the annotation (+ the repo to
# the allowlist if new).
#
# Trust note (ADR 0003): Backstage runs the allow-all permission policy, so
# every signed-in user (catalog/users.yaml) can start a privileged build.
# Closing that is the authentik sign-in + permission-policy roadmap item.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: petal-run
  title: Run a Petal pipeline
  description: Trigger a Petal pipeline for a catalog component; the run is recorded as started from Backstage by you
  tags:
    - petal
    - ci
spec:
  owner: user:blacklotus89898
  type: action

  parameters:
    - title: What to run
      required:
        - entity
        - pipeline
      properties:
        entity:
          title: Component
          type: string
          description: The catalog component this run is for (recorded as the run's source)
          default: component:default/petal
          ui:field: EntityPicker
          ui:options:
            # Only components that name a Petal repo can run anything.
            catalogFilter:
              kind: Component
              metadata.annotations.petal.io/repo:
                exists: true
        pipeline:
          title: Pipeline
          type: string
          description: "Pipeline in the component's repo (.petal/pipelines/) — e.g. validate for homelab-platform, docker-image for petal"
          # Custom field (backstage/packages/app/src/modules/petal): suggests
          # Petal's own catalog via the /petal proxy, accepts any typed name.
          ui:field: PetalPipelinePicker

  steps:
    - id: run
      name: Queue Petal run
      action: petal:run
      input:
        pipeline: ${{ parameters.pipeline }}
        entityRef: ${{ parameters.entity }}

  output:
    links:
      - title: Open run in Petal
        url: ${{ steps.run.output.runUrl }}
    text:
      - title: Run
        content: |
          Queued **${{ parameters.pipeline }}** as `${{ steps.run.output.runId }}`.
