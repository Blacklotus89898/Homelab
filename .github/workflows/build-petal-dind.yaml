name: Build and Push Petal DinD Image

on:
  push:
    branches: [main]
    paths:
      - 'services/petal/dind/**'
      - '.github/workflows/build-petal-dind.yaml'
  pull_request:
    paths:
      - 'services/petal/dind/**'
      - '.github/workflows/build-petal-dind.yaml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/petal/dind
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/blacklotus89898/petal-dind:27.5.1
            ghcr.io/blacklotus89898/petal-dind:latest
            ghcr.io/blacklotus89898/petal-dind:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
