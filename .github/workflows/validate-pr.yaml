name: Validate PR

on:
  pull_request:
    branches: [main]

jobs:
  validate-yaml:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          find . \( -name '*.yaml' -o -name '*.yml' \) \
            ! -path './.github/*' \
            ! -path './templates/*/skeleton/*' \
            -print0 | xargs -0 -I{} python3 -c "
          import yaml, sys
          with open('{}') as f:
              list(yaml.safe_load_all(f))
          print('OK: {}')
          "

  validate-k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate manifests
        run: |
          files=$(find services/ infrastructure/ platform/ -name '*.yaml' 2>/dev/null)
          if [ -z "$files" ]; then
            echo "No YAML files found, skipping"
            exit 0
          fi
          echo "$files" | xargs kubeconform \
                -strict \
                -summary \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  validate-helm:
    name: Helm templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add backstage https://backstage.github.io/charts
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Template Backstage chart
        run: |
          helm template backstage backstage/backstage \
            --version 2.8.2 \
            -f apps/backstage/values.yaml \
            --set backstage.appConfig.backend.database.connection.host=localhost \
            --set backstage.appConfig.backend.database.connection.password=dummy \
            > /dev/null && echo "Backstage chart OK"

      - name: Template ArgoCD chart
        run: |
          helm template argocd argo/argo-cd \
            --version 10.2.1 \
            -f apps/argocd/values.yaml \
            > /dev/null && echo "ArgoCD chart OK"

  validate-techdocs:
    name: TechDocs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install techdocs-core
        run: pip install mkdocs-techdocs-core

      - name: Validate mkdocs builds
        run: |
          find services/ -name 'mkdocs.yml' | while read f; do
            dir=$(dirname "$f")
            echo "Building TechDocs for $dir..."
            mkdocs build --config-file "$f" --site-dir /tmp/techdocs-build --strict
          done
          echo "All TechDocs builds passed"

  check-nodeport-conflicts:
    name: NodePort conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate NodePorts
        run: |
          echo "Scanning for NodePort assignments..."
          grep -r 'nodePort:' services/ infrastructure/ apps/ --include='*.yaml' -h \
            | grep -o '[0-9]\{5\}' \
            | sort | uniq -d \
            | while read port; do
                echo "ERROR: NodePort $port is assigned more than once"
                exit 1
              done
          echo "No NodePort conflicts found"

  trivy-iac:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan manifests for misconfigurations
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate-yaml
      - validate-k8s
      - validate-helm
      - validate-techdocs
      - check-nodeport-conflicts
      - trivy-iac
    steps:
      - name: Write summary
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || [ "$1" = "skipped" ] && echo "⏭️" || echo "❌"; }
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## PR Validation Report

          | Check | Result |
          |---|---|
          | YAML syntax | $(icon "${{ needs.validate-yaml.result }}") \`${{ needs.validate-yaml.result }}\` |
          | Kubernetes manifests | $(icon "${{ needs.validate-k8s.result }}") \`${{ needs.validate-k8s.result }}\` |
          | Helm templates | $(icon "${{ needs.validate-helm.result }}") \`${{ needs.validate-helm.result }}\` |
          | TechDocs | $(icon "${{ needs.validate-techdocs.result }}") \`${{ needs.validate-techdocs.result }}\` |
          | NodePort conflicts | $(icon "${{ needs.check-nodeport-conflicts.result }}") \`${{ needs.check-nodeport-conflicts.result }}\` |
          | Trivy IaC scan | $(icon "${{ needs.trivy-iac.result }}") \`${{ needs.trivy-iac.result }}\` |

          **PR:** #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}
          **Author:** ${{ github.actor }} · **Base:** \`${{ github.base_ref }}\` ← \`${{ github.head_ref }}\`
          EOF
