name: Validate PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # yamllint replaces the old safe_load syntax check (strict superset:
      # parse errors + duplicate keys + tabs/trailing spaces). Relaxed ruleset
      # lives in .yamllint, tuned to house style.
      - name: yamllint
        run: |
          python3 -m pip install --user yamllint
          yamllint -c .yamllint .

  validate-k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          # pinned so CI is reproducible; Renovate bumps this URL's version
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate manifests
        run: |
          files=$(find services/ infrastructure/ platform/ -name '*.yaml' 2>/dev/null)
          if [ -z "$files" ]; then
            echo "No YAML files found, skipping"
            exit 0
          fi
          echo "$files" | xargs kubeconform \
                -strict \
                -summary \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  validate-policies:
    name: Kyverno policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kyverno CLI
        run: |
          # pinned so CI is reproducible; Renovate bumps this URL's version.
          # Archive member is `kyverno` (per krew-index manifest for v1.19.1).
          curl -sSfL https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin kyverno

      # Renders the repo the way ArgoCD consumes it: kustomize dirs rendered,
      # bare directories (services/*, pod-cleanup, etc.) copied flat. The
      # gateway-api render is upstream content — kubeconform covers its shape,
      # our house policies don't apply to it.
      - name: Render manifests
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          for k in $(git ls-files '*kustomization.yaml' \
              | xargs -r -n1 dirname | sort -u \
              | grep -v '^infrastructure/gateway-api$'); do
            kubectl kustomize "$k" > "/tmp/rendered/$(echo "$k" | tr '/' '_').yaml"
          done
          for f in $(git ls-files 'services/*.yaml' \
              'infrastructure/pod-cleanup/*.yaml' \
              'infrastructure/backstage-k8s-rbac/*.yaml' \
              'infrastructure/victoria-metrics/*.yaml'); do
            cp "$f" "/tmp/rendered/$(echo "$f" | tr '/' '_')"
          done
          echo "--- rendered files ---"
          ls -1 /tmp/rendered

      - name: Apply policies
        run: |
          # explicit file list: no ambiguity about -r directory handling
          ls /tmp/rendered/*.yaml | xargs kyverno apply policies/ -r

  validate-helm:
    name: Helm templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add backstage https://backstage.github.io/charts
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Template Backstage chart
        run: |
          helm template backstage backstage/backstage \
            --version 2.8.2 \
            -f apps/backstage/values.yaml \
            --set backstage.appConfig.backend.database.connection.host=localhost \
            --set backstage.appConfig.backend.database.connection.password=dummy \
            > /dev/null && echo "Backstage chart OK"

      - name: Template ArgoCD chart
        run: |
          helm template argocd argo/argo-cd \
            --version 10.2.1 \
            -f apps/argocd/values.yaml \
            > /dev/null && echo "ArgoCD chart OK"

  validate-techdocs:
    name: TechDocs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install techdocs-core
        run: pip install mkdocs-techdocs-core

      - name: Validate mkdocs builds
        run: |
          find services/ -name 'mkdocs.yml' | while read f; do
            dir=$(dirname "$f")
            echo "Building TechDocs for $dir..."
            mkdocs build --config-file "$f" --site-dir /tmp/techdocs-build --strict
          done
          echo "All TechDocs builds passed"

  check-nodeport-conflicts:
    name: NodePort conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate NodePorts
        run: |
          echo "Scanning for NodePort assignments..."
          # extract only the value after `nodePort:` — the line's comment often
          # repeats the port in a URL, which the old bare-number grep double-counted
          dups=$(grep -rhE 'nodePort: *[0-9]+' services/ infrastructure/ apps/ --include='*.yaml' \
            | grep -oE '[0-9]+' \
            | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "ERROR: NodePorts assigned more than once:"
            echo "$dups"
            exit 1
          fi
          echo "No NodePort conflicts found"

  trivy-iac:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan manifests for misconfigurations
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate-yaml
      - validate-k8s
      - validate-policies
      - validate-helm
      - validate-techdocs
      - check-nodeport-conflicts
      - trivy-iac
    steps:
      - name: Write summary
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || [ "$1" = "skipped" ] && echo "⏭️" || echo "❌"; }
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## PR Validation Report

          | Check | Result |
          |---|---|
          | YAML syntax | $(icon "${{ needs.validate-yaml.result }}") \`${{ needs.validate-yaml.result }}\` |
          | Kubernetes manifests | $(icon "${{ needs.validate-k8s.result }}") \`${{ needs.validate-k8s.result }}\` |
          | Kyverno policies | $(icon "${{ needs.validate-policies.result }}") \`${{ needs.validate-policies.result }}\` |
          | Helm templates | $(icon "${{ needs.validate-helm.result }}") \`${{ needs.validate-helm.result }}\` |
          | TechDocs | $(icon "${{ needs.validate-techdocs.result }}") \`${{ needs.validate-techdocs.result }}\` |
          | NodePort conflicts | $(icon "${{ needs.check-nodeport-conflicts.result }}") \`${{ needs.check-nodeport-conflicts.result }}\` |
          | Trivy IaC scan | $(icon "${{ needs.trivy-iac.result }}") \`${{ needs.trivy-iac.result }}\` |

          **Run:** \`${{ github.event_name }}\` by ${{ github.actor }} on \`${{ github.sha }}\`
          EOF
