name: Release Please

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

      - name: Job summary
        if: always()
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$RELEASE_CREATED" = "true" ]; then
            echo "## Released \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "| | |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **Tag** | \`$TAG_NAME\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          elif [ "$PRS_CREATED" = "true" ]; then
            echo "## Release PR open" >> $GITHUB_STEP_SUMMARY
            echo "A release PR was opened/updated — merge it to cut the next release." >> $GITHUB_STEP_SUMMARY
          else
            echo "## No release" >> $GITHUB_STEP_SUMMARY
            echo "No releasable commits found on this push." >> $GITHUB_STEP_SUMMARY
          fi
