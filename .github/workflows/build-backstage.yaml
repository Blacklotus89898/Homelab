name: Build and Push Backstage Image

on:
  push:
    branches: [main]
    paths:
      - 'backstage/**'
      - '.github/workflows/build-backstage.yaml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backstage
          push: true
          tags: |
            ghcr.io/blacklotus89898/backstage:latest
            ghcr.io/blacklotus89898/backstage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            ICON="✅"; STATUS="Success"
          else
            ICON="❌"; STATUS="Failed"
          fi
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ${ICON} Backstage Image Build — ${STATUS}

          | | |
          |---|---|
          | **Commit** | \`${{ github.sha }}\` |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Triggered by** | ${{ github.actor }} |
          | **Image: latest** | \`ghcr.io/blacklotus89898/backstage:latest\` |
          | **Image: SHA tag** | \`ghcr.io/blacklotus89898/backstage:${{ github.sha }}\` |

          EOF
