name: Build and Push Backstage Image

on:
  push:
    branches: [main]
    paths:
      - 'backstage/**'
      - '.github/workflows/build-backstage.yaml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backstage
          push: true
          tags: |
            ghcr.io/blacklotus89898/backstage:latest
            ghcr.io/blacklotus89898/backstage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
