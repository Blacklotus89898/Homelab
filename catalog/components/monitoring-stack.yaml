apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: monitoring-stack
  description: "VictoriaMetrics k8s-stack: metrics, alert rules, alertmanager and Grafana"
  links:
    - url: https://grafana.lab.home/
      title: Grafana
  annotations:
    argocd/app-name: victoria-metrics
    backstage.io/kubernetes-namespace: monitoring
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/instance in (vmstack, victoria-metrics)'
    homelab.io/image-pinned: "chart"
    homelab.io/has-slo: "true"
    homelab.io/recovery: git
    backstage.io/techdocs-ref: url:https://github.com/Blacklotus89898/Homelab/tree/main/services/monitoring-stack
  tags:
    - observability
spec:
  type: service
  lifecycle: production
  owner: user:blacklotus89898
  system: homelab
