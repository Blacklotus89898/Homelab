apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: authentik
  description: Identity provider and SSO
  links:
    - url: https://auth.lab.home/
      title: Authentik UI
  annotations:
    argocd/app-name: authentik
    backstage.io/kubernetes-namespace: default # Portainer-era in-place adoption: authentik lives in `default`
    backstage.io/kubernetes-label-selector: 'app in (authentik-server, authentik-worker, authentik-postgres, authentik-redis)'
    backstage.io/techdocs-ref: url:https://github.com/Blacklotus89898/Homelab/tree/main/services/authentik
    homelab.io/image-pinned: "true"
    homelab.io/has-slo: "true"
    homelab.io/recovery: git
spec:
  type: service
  lifecycle: production
  owner: user:blacklotus89898
  system: homelab
