  name: uptime-kuma
  description: "Uptime monitoring with a status UI"
  links:
    - url: https://uptime.lab.home/
      title: Uptime Kuma UI
  annotations:
    argocd/app-name: uptime-kuma
    backstage.io/kubernetes-namespace: monitoring
    backstage.io/kubernetes-label-selector: 'app=uptime-kuma'
