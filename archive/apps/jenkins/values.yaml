controller:
  # Jenkins LTS on JDK 21 — digest-pinned to the running image (was the
  # floating lts-jdk21 tag; a retag would silently change the controller on
  # the next pod schedule). Renovate bumps this via PR once installed.
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: lts-jdk21@sha256:c1e4c349365f6d16d88595b2c5f7e8ff39b8ae1d061f62420bac193b4b9616d0
    pullPolicy: IfNotPresent

  # NodePort — consistent with other services in this cluster
  serviceType: NodePort
  nodePort: 30808

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # Jenkins downloads plugins on first boot — give it up to 10 minutes
  startupProbe:
    httpGet:
      path: /login
      port: 8080
    failureThreshold: 60
    periodSeconds: 10

  # Run builds directly on the controller (homelab — no separate agents needed)
  numExecutors: 2

  # Additional plugins on top of chart defaults
  additionalPlugins:
    - job-dsl:latest
    - github-branch-source:latest
    - github:latest
    - pipeline-stage-view:latest

  # JCasC: declarative Jenkins configuration (no setup wizard)
  JCasC:
    defaultConfig: true
    configScripts:
      jobs: |
        jobs:
          - script: >
              multibranchPipelineJob('homelab') {
                description('Homelab GitOps repo — CI via Jenkinsfile on each branch')
                branchSources {
                  git {
                    id('homelab-git')
                    remote('https://github.com/Blacklotus89898/Homelab.git')
                    credentialsId('')
                    includes('main feature/* fix/* ci/* chore/* feat/*')
                    excludes('release-please--*')
                  }
                }
                factory {
                  workflowBranchProjectFactory {
                    scriptPath('Jenkinsfile')
                  }
                }
                orphanedItemStrategy {
                  discardOldItems {
                    numToKeep(5)
                  }
                }
              }

  # Prometheus metrics endpoint
  prometheus:
    enabled: false

persistence:
  enabled: true
  size: 10Gi
  storageClass: local-path

agent:
  enabled: true
