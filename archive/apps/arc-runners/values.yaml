githubConfigUrl: "https://github.com/Blacklotus89898/Homelab"
githubConfigSecret: arc-runner-secret

# Explicit service account ref — required when helm template runs offline (ArgoCD)
# without this the chart tries to discover it via cluster API and fails
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

# Label used in workflows: runs-on: homelab-runner
runnerScaleSetName: homelab-runner

# Scale to zero when idle; max 3 concurrent jobs
minRunners: 0
maxRunners: 3

# Docker-in-Docker: gives runner pods a privileged Docker daemon sidecar.
# Required for docker/build-push-action (Backstage image build).
containerMode:
  type: dind

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 4Gi
