apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: kavita
  labels:
    app: kavita
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: kavita
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: kavita
    spec:
      containers:
        - name: kavita
          image: jvmilazz0/kavita:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: "1Gi"
            limits:
              cpu: "4"  
              memory: 6Gi
              ephemeral-storage: "5Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: kavita-config
              mountPath: /kavita/config
            - name: comic-data
              mountPath: /comics
              readOnly: true
      volumes:
        - name: kavita-config
          hostPath:
            path: /var/lib/kavita/config # Adjust this path on your host as needed
            type: DirectoryOrCreate
        - name: comic-data
          hostPath:
            path: /mnt/smb_storage
            type: Directory