apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: kavita
  labels:
    app: kavita
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: kavita
  # Recreate, not RollingUpdate: kavita keeps a SQLite DB in the writable
  # hostPath config dir — a surge pod would run a second writer against it
  # during every rollout. Trade-off: a ~30s boot gap per rollout.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: kavita
    spec:
      containers:
        - name: kavita
          image: jvmilazz0/kavita:0.9.1@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a # pinned to running digest 2026-09-29; Renovate PRs the bumps
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
            # Requests right-sized 2026-10-21 from 30d peaks (0.045 cores,
            # 776Mi working set): 2 CPU/2Gi reserved 25% of the worker's CPU
            # for an app that idles at ~5m. Limits UNCHANGED — the 6Gi memory
            # limit is the 2026-07-28 OOM fix (issue #3); CPU 4 = scan bursts.
            requests:
              cpu: 100m
              memory: 1Gi
              ephemeral-storage: "1Gi"
            limits:
              cpu: "4"
              memory: 6Gi
              ephemeral-storage: "5Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: kavita-config
              mountPath: /kavita/config
            - name: comic-data
              mountPath: /comics
              readOnly: true
      volumes:
        - name: kavita-config
          hostPath:
            path: /var/lib/kavita/config # Adjust this path on your host as needed
            type: DirectoryOrCreate
        - name: comic-data
          hostPath:
            path: /mnt/smb_storage
            type: Directory
