# Petal control plane. Three containers in one pod:
#
#   petal    — the Go binary: API + UI + scheduler + SQLite registry + the
#              step-runner executor (pipelines from the target repo's
#              .petal/pipelines/*.yaml, run as plain Docker containers —
#              Petal repo ADR 0002)
#   dind     — Docker daemon the step containers run in. petal talks to this
#              sidecar daemon (DOCKER_HOST=tcp://127.0.0.1:2375) and creates
#              sibling step containers inside it — the same DinD pattern the
#              ARC runners already run in this cluster.
#   git-sync — keeps the Petal repo checked out at /git/repo so the dogfood
#              `docker-image` pipeline (Petal builds Petal) has real source.
#
# Pod-level notes:
#  - privileged: required for DinD (same as ARC runners / Jenkins agents)
#  - fuse-overlayfs storage driver via the custom petal-dind image: the host's
#    overlayfs rejects overlay2-on-overlay, and the vfs fallback deep-copies
#    every layer (multi-hundred-MB step images would explode on disk).
#  - strategy: Recreate — SQLite on RWO PVC means exactly one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petal
  namespace: petal
  labels:
    app: petal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: petal
  template:
    metadata:
      labels:
        app: petal
    spec:
      containers:
        - name: dind
          # Custom DinD with fuse-overlayfs (built by build-petal-dind.yaml) —
          # stock dind falls back to vfs on an overlayfs host, which deep-copies
          # every image layer and extracts ~15x slower.
          # Rollback: docker:27-dind + --storage-driver=vfs.
          image: ghcr.io/blacklotus89898/petal-dind:27.5.1
          imagePullPolicy: IfNotPresent
          args:
            - --host=tcp://0.0.0.0:2375
            - --host=unix:///var/run/docker.sock
            - --storage-driver=fuse-overlayfs
          env:
            - name: DOCKER_TLS_CERTDIR
              value: "" # TLS off; port is loopback-only inside the pod
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 15
            timeoutSeconds: 10 # docker info is slow while images extract
            failureThreshold: 5
          startupProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          volumeMounts:
            - name: docker-lib
              mountPath: /var/lib/docker

        - name: petal
          # :latest while Petal is under active development — every push to
          # Petal main should reach the cluster without a manifest bump.
          # Before calling Petal stable: pin back to an immutable <sha> tag
          # (+ IfNotPresent) so a bad push can't self-deploy.
          image: ghcr.io/blacklotus89898/petal:latest
          imagePullPolicy: Always
          args:
            - -addr
            - :8080
            - -db
            - /data/petal.db
            - -data
            - /data
            - -executor
            - steps
            - -workdir
            - /git/repo
            - -workers
            - "2"
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: src
              mountPath: /git

        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.1.0
          args:
            - --repo=https://github.com/Blacklotus89898/Petal.git
            - --ref=main
            - --period=30s
            - --root=/git
            - --link=repo
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: src
              mountPath: /git

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: petal-data
        # git-sync checkout (repo snapshot source). Safe to lose — re-synced
        # on pod start. Per-run workspaces live under the data PVC instead
        # (<data>/work/<run_id>), so steps never write into the checkout.
        - name: src
          emptyDir:
            sizeLimit: 1Gi
        # Docker image layers live on the SMB share, NOT the root fs: the
        # kubelet evicts on root-fs pressure, and a 15Gi build cache sharing
        # the OS disk caused repeated disk-pressure incidents (see the
        # k3s-disk-cleanup runbook). hostPath because only the worker runs
        # petal, and virtiofs /mnt/smb_storage is fstab-mounted there.
        # The cache is disposable — pod re-pulls images if the share is lost.
        - name: docker-lib
          hostPath:
            path: /mnt/smb_storage/petal-docker-lib
            type: DirectoryOrCreate
