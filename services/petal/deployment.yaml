# Petal control plane. Three containers in one pod:
#
#   petal    — the Go binary: API + UI + scheduler + SQLite registry
#   dind     — Docker daemon that hosts the self-hosted Dagger engine.
#              The Dagger SDK cannot provision an engine from inside a plain
#              container (no docker driver there), so petal talks to this
#              sidecar daemon (DOCKER_HOST=tcp://127.0.0.1:2375) and the
#              engine runs as a nested container inside it — the same DinD
#              pattern the ARC runners already run in this cluster.
#   git-sync — keeps the Petal repo checked out at /git/repo so the dogfood
#              `docker-image` pipeline (Petal builds Petal) has real source.
#
# Pod-level notes:
#  - privileged: required for DinD (same as ARC runners / Jenkins agents)
#  - fuse-overlayfs storage driver via the custom petal-dind image: the host's
#    overlayfs rejects overlay2-on-overlay, and the vfs fallback deep-copies
#    every layer (646MB engine image → >8Gi on disk).
#  - strategy: Recreate — SQLite on RWO PVC means exactly one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petal
  namespace: petal
  labels:
    app: petal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: petal
  template:
    metadata:
      labels:
        app: petal
    spec:
      containers:
        - name: dind
          # Custom DinD with fuse-overlayfs (built by build-petal-dind.yaml) —
          # stock dind falls back to vfs on an overlayfs host, which deep-copies
          # every image layer (646MB engine → >8Gi) and extracts ~15x slower.
          # Rollback: docker:27-dind + --storage-driver=vfs.
          image: ghcr.io/blacklotus89898/petal-dind:27.5.1
          imagePullPolicy: IfNotPresent
          args:
            - --host=tcp://0.0.0.0:2375
            - --host=unix:///var/run/docker.sock
            - --storage-driver=fuse-overlayfs
          env:
            - name: DOCKER_TLS_CERTDIR
              value: "" # TLS off; port is loopback-only inside the pod
          securityContext:
            privileged: true
          lifecycle:
            # Prime the engine image before any run needs it: the SDK aborts
            # engine provisioning after ~5min, and pulling over vfs takes
            # longer than that cold. Pin the version to the SDK's engine tag.
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - until docker info >/dev/null 2>&1; do sleep 2; done; docker pull registry.dagger.io/engine:v0.21.9 || true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 15
            timeoutSeconds: 10 # docker info is slow while vfs extracts layers
            failureThreshold: 5
          startupProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60 # first boot can pull/extract the engine image for many minutes
          volumeMounts:
            - name: docker-lib
              mountPath: /var/lib/docker

        - name: petal
          # Pinned to the CI-built image for Petal commit a98c79f (cron scheduler
          # + build workflow). To upgrade: push Petal repo, wait for the
          # build-petal.yaml run, then bump this to the new commit sha tag.
          image: ghcr.io/blacklotus89898/petal:a98c79fd4cab1d3f66dccfb296b971ab36cea9e4
          imagePullPolicy: IfNotPresent
          args:
            - -addr
            - :8080
            - -db
            - /data/petal.db
            - -executor
            - dagger
            - -workdir
            - /git/repo
            - -workers
            - "2"
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: src
              mountPath: /git

        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.1.0
          args:
            - --repo=https://github.com/Blacklotus89898/Petal.git
            - --ref=main
            - --period=30s
            - --root=/git
            - --link=repo
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: src
              mountPath: /git

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: petal-data
        # Build context streamed to the engine per run; safe to lose.
        - name: src
          emptyDir:
            sizeLimit: 1Gi
        # Docker image layers + Dagger engine container live here. PVC (not
        # emptyDir) so the engine image and build-layer cache survive pod
        # restarts — re-pulling it over vfs takes >5min and exceeds the SDK's
        # engine-connect deadline.
        - name: docker-lib
          persistentVolumeClaim:
            claimName: petal-docker-lib
