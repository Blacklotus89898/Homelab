# Petal multi-repo allowlist (Petal ADR 0004) — the repos a run may name, by
# alias. THIS FILE IS THE TRUST BOUNDARY: pipeline YAML from any repo listed
# here runs on the worker next to the privileged DinD daemon, so adding a repo
# is a reviewed commit, and the repo's own branch protection matters.
# v1: public https repos only (Petal holds no clone credentials).
# Privileges (Petal ADR 0006): `secrets:` (keys of the petal-secrets Secret)
# and `docker: true` (steps may drive the DinD daemon) are granted ONLY at a
# repo's `trusted_refs` (default: default_ref) — any other branch/tag/SHA runs
# unprivileged. docker reaches everything the privileged daemon can, every
# secret included: grant it only where you'd grant all, on protected refs.
# `schedules:` are declarative cron triggers: synced at startup into decl-*
# rows (insert/update/delete) — git owns them; API-made schedules are separate.
# Petal reads it at startup — restart through git: bump the
# `petal.io/config-rev` pod annotation in deployment.yaml in the same commit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: petal-repos
  namespace: petal
data:
  repos.yaml: |
    self: # the git-synced Petal repo (always main)
      docker: true # docker-image builds Petal
    repos:
      homelab:
        url: https://github.com/Blacklotus89898/Homelab.git
        default_ref: main
        secrets: [e2e-canary] # secrets-e2e pipeline (random test value)
      petal:
        url: https://github.com/Blacklotus89898/Petal.git
        default_ref: main
        docker: true # docker-image, run via Backstage petal:run (repo: petal)
      tulip:
        url: https://github.com/Blacklotus89898/Tulip.git
        default_ref: main
        # No secrets, no docker: the backtest pipeline is read-only (Yahoo
        # history in, a text summary out). Tulip's approval boundary and the
        # tulip-questrade / tulip-approval-* secrets never come near Petal.
        notify_success: [backtest] # monthly summary → ntfy "petal" (ADR 0008)
    schedules:
      # Nightly self-check of the Homelab repo — the job Jenkins used to run
      # (Homelab ADR 0010). Dead-man alert: PetalNightlyValidateMissing.
      - id: homelab-validate-nightly
        repo: homelab
        pipeline: validate
        cron: "17 3 * * *" # 03:17 UTC, off the :00 marks
      # Monthly re-run of Tulip's pre-registered allocator comparison
      # (Tulip docs/backtests) on fresh history; summary = the run output.
      - id: tulip-backtest-monthly
        repo: tulip
        pipeline: backtest
        cron: "41 6 2 * *" # 06:41 UTC on the 2nd: month-end bars are in
