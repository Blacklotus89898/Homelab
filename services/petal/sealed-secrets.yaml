# Petal pipeline secrets (Petal ADR 0006): one key per secret, mounted at
# /etc/petal-secrets in the petal AND dind containers. Grants live in
# repos-configmap.yaml (per repo + ref). e2e-canary is a random,
# non-sensitive test value for the secrets E2E pipeline.
# Real credentials are sealed by the operator (how: services/petal/docs, "Secrets").
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: petal-secrets
  namespace: petal
spec:
  encryptedData:
    e2e-canary: 
  template:
    metadata:
      name: petal-secrets
      namespace: petal
