# SQLite run registry — WAL mode, single writer, so the Deployment uses
# strategy: Recreate and this PVC is the only durable state.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petal-data
  namespace: petal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# Docker data root for the DinD sidecar: engine image + build layers. Must
# outlive pod restarts (see deployment.yaml docker-lib comment).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petal-docker-lib
  namespace: petal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
