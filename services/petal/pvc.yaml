# SQLite run registry — WAL mode, single writer, so the Deployment uses
# strategy: Recreate and this PVC is the only durable state.
# (The Docker build cache moved to the smb_storage hostPath — see
# deployment.yaml docker-lib comment. The old petal-docker-lib PVC was
# deleted 2026-09-07.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petal-data
  namespace: petal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
