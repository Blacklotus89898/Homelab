# ClusterIP only: alertmanager (ns monitoring) posts /alerts; the read API is
# reachable in-cluster (kubectl port-forward for a look). No NodePort, no
# gateway route — the webhook is unauthenticated by design (ADR 0011: it can
# only trigger read-only, deduped, capped collection).
apiVersion: v1
kind: Service
metadata:
  name: warden
  namespace: warden
  labels:
    app: warden
spec:
  selector:
    app: warden
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
