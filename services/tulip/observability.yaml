# Tulip /metrics (journal events by kind, build info), scraped by vmagent
# (selectAllByDefault), plus alerts on the loop's health.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tulip
  namespace: tulip
spec:
  selector:
    matchLabels:
      app: tulip
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tulip
  namespace: tulip
spec:
  groups:
    - name: tulip
      rules:
        # Cycles run 10:05 + 15:00 Toronto on trading days. Checked Tue–Sat
        # after 21:00 UTC (16–17:00 Toronto), so a weekend gap can't fire it;
        # a TSX holiday can (rare, warning).
        - alert: TulipNoCycle
          expr: |
            # sum(): a rollout leaves the old pod's series in the 26h window
            # with 0 cycles (false page 2026-10-27); vector(0): no series = no cycle.
            ((sum(increase(tulip_journal_events_total{kind="cycle.finished"}[26h])) or vector(0)) == 0)
              and on() (day_of_week() >= 2 and day_of_week() <= 6 and hour() >= 21)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Tulip ran no cycle in 26h on a trading day"
            description: "The loop didn't fire (pod down at the slot, calendar out of range, or a crash). kubectl -n tulip logs deploy/tulip; MCP tool cycle_run runs one by hand."
            runbook_url: "kb://runbooks/tulip-alerts.md"
        - alert: TulipMarketDataUnavailable
          expr: increase(tulip_journal_events_total{kind="data.unavailable"}[1d]) > 4
          labels:
            severity: warning
          annotations:
            summary: "Tulip market data failed repeatedly today"
            description: "More than 4 data.unavailable events in a day — Yahoo is rate-limiting or the endpoint changed. Tulip fails closed (proposes nothing); check journal_list kind=data.unavailable."
            runbook_url: "kb://runbooks/tulip-alerts.md"
        - alert: TulipKillSwitchArmed
          expr: tulip_kill_switch == 1
          labels:
            severity: warning
          annotations:
            summary: "Tulip's kill switch is armed — nothing will execute"
            description: "Armed by Claude Code (kill_switch_arm) or the operator. Only the operator disarms it, with the passphrase, at http://192.168.0.108:30995/killswitch."
            runbook_url: "kb://runbooks/tulip-alerts.md"
        # Co-pilot only (the gauge exists only then). 1 ok, 0 failing,
        # -1 not tried yet — so == 0, never != 1 (weekends would fire).
        - alert: TulipBrokerAuthFailing
          expr: tulip_broker_auth_ok == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Tulip can't read the Questrade account — it proposes nothing"
            description: "Refresh token expired (unused ~7 days), revoked, spent elsewhere, or the rotated token couldn't be persisted. Generate a new manual-authorization token in Questrade's API Centre and re-seal tulip-questrade (TechDocs → Co-pilot). journal_list kind=broker.auth_failed has the reason."
            runbook_url: "kb://runbooks/tulip-alerts.md"
