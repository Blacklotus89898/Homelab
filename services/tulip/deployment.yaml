# Tulip — human-gated trading co-pilot (github.com/Blacklotus89898/Tulip,
# ADR 0001–0003). Generated by the homelab-service golden path (PR #9), then
# adjusted for what the template can't know:
#   - Recreate: the journal is SQLite, one writer — two pods must never overlap.
#     LOAD-BEARING in co-pilot mode too: the Questrade refresh token is
#     single-use, so two pods would spend it twice and break the chain.
#     Never switch this to RollingUpdate or raise replicas.
#   - /data on a PVC (pvc.yaml); distroless :nonroot image → fsGroup 65532
#   - read-only root fs; the only writable path is the journal volume
#   - TULIP_API_TOKEN (sealed-api-token.yaml) guards POST /mcp. It can read,
#     propose, decline and arm the kill switch — it can NOT approve orders.
# Upgrade: push Tulip → its CI builds :<sha> → bump the tag here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tulip
  namespace: tulip
  labels:
    app: tulip
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tulip
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tulip
    spec:
      # Golden-path default: no SA token unless the service needs one (CIS 5.1.6)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: tulip
          image: ghcr.io/blacklotus89898/tulip:8686b4338d83a5850ce9dc4382b2ced71f3d96dc
          imagePullPolicy: IfNotPresent
          # Co-pilot (ADR 0003): read-only Questrade, the operator places
          # every order. Needs tulip-questrade (sealed-questrade.yaml) —
          # copilot without TULIP_QUESTRADE_ACCOUNT exits (crash-loop).
          args: ["-addr", ":8080", "-db", "/data/tulip.db", "-mode", "copilot"]
          env:
            - name: TULIP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tulip-api-token
                  key: TULIP_API_TOKEN
            # The operator's approval passphrase, as a PBKDF2 hash only (Tulip
            # ADR 0002 §3) — sealed by the operator (services/tulip/README in
            # TechDocs). optional: without it Tulip runs, approvals stay
            # disabled and suggestions just expire (fail closed).
            # Agents never read this secret (Homelab CLAUDE.md).
            - name: TULIP_APPROVAL_PASSPHRASE_HASH
              valueFrom:
                secretKeyRef:
                  name: tulip-approval
                  key: TULIP_APPROVAL_PASSPHRASE_HASH
                  optional: true
            # Co-pilot mode (Tulip ADR 0003): READ-ONLY Questrade access to one
            # account. Both sealed by the operator (TechDocs → Co-pilot).
            # The refresh token only bootstraps — Tulip rotates and persists
            # it under /data. Agents never use it (Homelab CLAUDE.md).
            - name: QUESTRADE_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tulip-questrade
                  key: QUESTRADE_REFRESH_TOKEN
                  optional: true
            - name: TULIP_QUESTRADE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: tulip-questrade
                  key: TULIP_QUESTRADE_ACCOUNT
                  optional: true
            - name: TULIP_NTFY_URL
              value: http://ntfy.monitoring.svc
            - name: TULIP_NTFY_TOPIC
              value: tulip-approvals
            # What the approval link opens on the phone: the LAN NodePort, since
            # the phone doesn't trust the lab CA yet (v3 gate: TLS there).
            - name: TULIP_PUBLIC_URL
              value: http://192.168.0.108:30995
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tulip-data
