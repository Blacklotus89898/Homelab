# Tulip — human-approved paper-trading agent (github.com/Blacklotus89898/Tulip,
# ADR 0001/0002). Generated by the homelab-service golden path (PR #9), then
# adjusted for what the template can't know:
#   - Recreate: the journal is SQLite, one writer — two pods must never overlap
#   - /data on a PVC (pvc.yaml); distroless :nonroot image → fsGroup 65532
#   - read-only root fs; the only writable path is the journal volume
#   - TULIP_API_TOKEN (sealed-api-token.yaml) guards POST /mcp. It can read,
#     propose, decline and arm the kill switch — it can NOT approve orders.
# Upgrade: push Tulip → its CI builds :<sha> → bump the tag here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tulip
  namespace: tulip
  labels:
    app: tulip
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tulip
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tulip
    spec:
      # Golden-path default: no SA token unless the service needs one (CIS 5.1.6)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: tulip
          image: ghcr.io/blacklotus89898/tulip:11d3cbadc56acde6c010034cc4f73ff0e0a8cc77
          imagePullPolicy: IfNotPresent
          args: ["-addr", ":8080", "-db", "/data/tulip.db", "-mode", "paper"]
          env:
            - name: TULIP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tulip-api-token
                  key: TULIP_API_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tulip-data
