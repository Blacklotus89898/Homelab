apiVersion: v1
kind: Service
metadata:
  name: tulip-svc
  namespace: tulip
  labels:
    app: tulip
spec:
  type: NodePort
  selector:
    app: tulip
  ports:
    - name: http # the VMServiceScrape and HTTPRoute refer to it
      port: 8080
      targetPort: 8080
      nodePort: 30995
      protocol: TCP
