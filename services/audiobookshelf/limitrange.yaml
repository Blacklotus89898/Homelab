apiVersion: v1
kind: LimitRange
metadata:
  name: audiobookshelf-limits
  namespace: audiobookshelf
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 4Gi
