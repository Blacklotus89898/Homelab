# Services — names/ports/NodePort preserved from the live deployment.
# NodePort 30080 is the registered authentik entrypoint (uptime-kuma monitor
# and Backstage catalog reference it).
apiVersion: v1
kind: Service
metadata:
  name: authentik
  namespace: default
spec:
  type: NodePort
  selector:
    app: authentik-server
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgres
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: authentik-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: authentik-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
