# authentik background worker (celery). Probe = `ak healthcheck`, authentik's
# own command (verified working in-image; celery CLI ping is NOT functional
# in this image). Same adoption caveats as server.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      containers:
        - name: authentik
          image: ghcr.io/goauthentik/server@sha256:1839674f14911f4e50cf6495caa2de9db0d7a16b5ce46341bcdc37a8a6848c0a # 2025.2.4 (previous pin 404s on ghcr; found by the 2026-11-05 bootstrap rehearsal)
          imagePullPolicy: IfNotPresent
          args:
            - worker
          envFrom:
            - configMapRef:
                name: authentik-config
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-credentials
                  key: SECRET_KEY
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 576Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - ak
                - healthcheck
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - ak
                - healthcheck
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - mountPath: /media
              name: media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media-pvc
