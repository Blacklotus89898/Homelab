# sprout: generated by the homelab-service golden path.
# Upgrade: the service repo's CI pushes :<sha>, then bump the image below in a PR.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprout
  namespace: sprout
  labels:
    app: sprout
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: sprout
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sprout
    spec:
      # Golden-path default: no SA token unless the service needs one (CIS 5.1.6)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532 # volumes writable by the container user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sprout
          image: ghcr.io/blacklotus89898/sprout:3e7b865f7e4ec3a32a190bc7639a0452101b6b0a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http # the Service, VMServiceScrape and HTTPRoute refer to it
              containerPort: 8080
              protocol: TCP
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # writable paths are the mounts below
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
