# /etc/systemd/journald.conf.d/50-homelab-size.conf — on BOTH nodes.
# Hard cap for the system journal (without it journald may use 10% of the
# filesystem: ~3G on debian, ~5G on the worker). The worker's daily
# k3s-disk-cleanup also vacuums to 300M; this makes the cap continuous and
# covers debian, which has no cleanup timer. Applied 2026-10-24.
[Journal]
SystemMaxUse=300M
SystemKeepFree=2G
MaxRetentionSec=1month
