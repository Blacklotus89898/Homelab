# Per-service routes on the lab Gateway (ADR 0009). One HTTPRoute per service,
# created in the SERVICE's namespace (no ReferenceGrants needed) but owned by the
# gateways app — one file is the hostname registry: <name>.lab.home -> service.
# Attaches to the https listener only: https://<name>.lab.home (TLS, wildcard
# cert). Plain http is answered by the catch-all 301 in http-redirect.yaml.
#
# Not routed yet: backstage — its app/backend baseUrl and GitHub OAuth callback
# are bound to http://192.168.0.108:30900; moving it is a config + OAuth-app
# change that ships through its canary rollout, separately.
---
# server.insecure=true; CLI via gateway needs --grpc-web
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: istio-system
      sectionName: https # http is redirect-only (http-redirect.yaml)
  hostnames:
    - argocd.lab.home
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
