apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: cluster-collector
  namespace: monitoring
spec:
  mode: daemonset
  serviceAccount: cluster-collector

  # Mount host log paths for log collection
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods

  env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    # TODO: move to SealedSecret
    # base64("admin@homelab.local:CHANGE_ME") — update after setting OO password
    - name: OO_AUTH
      value: "CHANGE_ME_BASE64_EMAIL_COLON_PASSWORD"

  config:
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        include_file_path: true
        operators:
          - type: router
            id: get-format
            routes:
              - output: parser-docker
                expr: 'body matches "^\\{"'
              - output: parser-crio
                expr: 'true'
          - type: json_parser
            id: parser-docker
          - type: regex_parser
            id: parser-crio
            regex: '^(?P<time>[^ Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'

      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "https://${env:NODE_NAME}:10250"
        insecure_skip_verify: true
        metric_groups: [node, pod, container]

    processors:
      batch:
        timeout: 5s
      memory_limiter:
        limit_mib: 256
        check_interval: 5s
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name

    exporters:
      otlphttp/openobserve:
        endpoint: http://openobserve.openobserve.svc.cluster.local:5080/api/default
        headers:
          Authorization: "Basic ${env:OO_AUTH}"

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/openobserve]
        metrics:
          receivers: [kubeletstats]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/openobserve]
