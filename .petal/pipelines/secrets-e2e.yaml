# Petal ADR 0006 end-to-end check: a granted secret arrives as a read-only
# file, is masked in the log, and is in neither env nor the workspace; a step
# that didn't request it can't see it. Prints only a 12-char hash prefix.
description: Prove Petal secrets delivery and masking (e2e-canary is a random test value)
max_parallel: 2
steps:
  - name: with-secret
    image: alpine:3.21
    secrets: [e2e-canary]
    needs: []
    run: |
      f="$PETAL_SECRET_E2E_CANARY_FILE"
      test -r "$f"
      v="$(cat "$f")"
      echo "value in the log: $v"
      echo "sha256 prefix: $(printf '%s' "$v" | sha256sum | cut -c1-12)"
      if printf '%s' "$v" > "$f" 2>/dev/null; then echo "FAIL: secret file is writable"; exit 1; fi
      if env | grep -qF "$v"; then echo "FAIL: secret value in env"; exit 1; fi
      if grep -rqF "$v" /src; then echo "FAIL: secret value in the workspace"; exit 1; fi
      echo "ok: read-only file, not in env, not in /src"
  - name: without-secret
    image: alpine:3.21
    needs: []
    run: |
      if [ -e /run/petal/secrets/e2e-canary ] || env | grep -q PETAL_SECRET_; then
        echo "FAIL: a step that did not request the secret can see it"; exit 1
      fi
      echo "ok: no secret without a request"
